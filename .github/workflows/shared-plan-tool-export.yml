name: Shared plan scanner tool export

on:
  push:
    branches:
      - agent/shared-plan-go-cache-20260802
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.25.12'
          cache: false
      - name: Build pinned nuclei
        env:
          GOBIN: ${{ runner.temp }}/shared-plan-tools/bin
          GOPROXY: https://proxy.golang.org
          GOSUMDB: sum.golang.org
        run: |
          mkdir -p "$GOBIN"
          go install github.com/projectdiscovery/nuclei/v3/cmd/nuclei@v3.4.10
          "$GOBIN/nuclei" -version
          sha256sum "$GOBIN/nuclei" > "$GOBIN/nuclei.sha256"
      - name: Upload scanner tool
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-plan-tools-${{ github.run_id }}
          path: ${{ runner.temp }}/shared-plan-tools/bin
          if-no-files-found: error
          retention-days: 1
