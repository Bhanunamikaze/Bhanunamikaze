name: Verify private shared-plan coverage merge

on:
  pull_request:
    branches:
      - agent/shared-plan-go-cache-20260802
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  STEINZ_REF: agent/shared-scan-execution-plan-integration

jobs:
  credential-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      C_STEINZDAST_PAT: ${{ secrets.STEINZDAST_PAT }}
      C_STEINZ_PAT: ${{ secrets.STEINZ_PAT }}
      C_PRIVATE_REPO_PAT: ${{ secrets.PRIVATE_REPO_PAT }}
      C_PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      C_REPO_PAT: ${{ secrets.REPO_PAT }}
      C_REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
      C_GH_PAT: ${{ secrets.GH_PAT }}
      C_GITHUB_PAT: ${{ secrets.GITHUB_PAT }}
      C_PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
      C_PERSONAL_TOKEN: ${{ secrets.PERSONAL_TOKEN }}
      C_ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
      C_ACTIONS_PAT: ${{ secrets.ACTIONS_PAT }}
      C_PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      C_TOKEN: ${{ secrets.TOKEN }}
    steps:
      - name: Probe configured token names without disclosure
        id: probe
        run: |
          set +x
          success=""
          for name in STEINZDAST_PAT STEINZ_PAT PRIVATE_REPO_PAT PRIVATE_REPO_TOKEN REPO_PAT REPO_TOKEN GH_PAT GITHUB_PAT PERSONAL_ACCESS_TOKEN PERSONAL_TOKEN ACCESS_TOKEN ACTIONS_PAT PROFILE_TOKEN TOKEN; do
            var="C_${name}"
            token="${!var:-}"
            if [ -z "$token" ]; then
              echo "$name=unset"
              continue
            fi
            auth=$(printf 'x-access-token:%s' "$token" | base64 -w0)
            if git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" ls-remote --exit-code https://github.com/Bhanunamikaze/SteinzDAST.git "$STEINZ_REF" >/dev/null 2>&1; then
              echo "$name=usable"
              success="$name"
              break
            fi
            echo "$name=not-authorized"
          done
          if [ -n "$success" ]; then
            echo "usable=true" >> "$GITHUB_OUTPUT"
            echo "$success" > /tmp/usable-secret-name.txt
          else
            echo "usable=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
      - name: Upload winning secret name only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shared-plan-private-credential-probe-${{ github.run_id }}
          path: /tmp/usable-secret-name.txt
          if-no-files-found: ignore
          retention-days: 1
